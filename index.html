<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Ürün Sıralayıcı</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="beta_8646539.png">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip { position: relative; display: inline-block; cursor: help; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 260px; background-color: #1e293b; color: #fff;
            text-align: left; border-radius: 8px; padding: 14px; position: absolute;
            z-index: 50; top: 150%; left: 50%; margin-left: -130px; opacity: 0;
            transition: opacity 0.2s; font-size: 0.85rem; line-height: 1.5;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
        }
        .tooltip .tooltiptext::after {
            content: ""; position: absolute; bottom: 100%; left: 50%;
            margin-left: -5px; border-width: 5px; border-style: solid;
            border-color: transparent transparent #1e293b transparent;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        
        /* Tablo satır animasyonu */
        .product-row { transition: all 0.2s ease; }
        
        /* Mobil Kaydırma İpucu */
        .scroll-hint { display: none; }
        @media (max-width: 640px) {
            .scroll-hint { display: block; }
        }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-10 font-sans text-slate-900">
    <div class="max-w-5xl mx-auto">
        
        <header class="mb-8 text-center">
            <div class="flex items-center justify-center gap-3 mb-2">
                <img src="beta_8646539.png" alt="Logo" class="w-10 h-10 object-contain">
                <h1 class="text-2xl md:text-3xl font-extrabold text-indigo-700 tracking-tight">Beta Sıralayıcı</h1>
            </div>
            <p class="text-slate-500 text-xs md:text-sm">Matematiksel güven aralığı ile objektif sıralama.</p>
        </header>

        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 border border-slate-200">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Maks Puan</label>
                <input type="number" id="maxScale" value="5" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-slate-700 transition-all">
            </div>
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Güven Seviyesi</label>
                    <div class="tooltip bg-indigo-100 text-indigo-600 w-4 h-4 flex items-center justify-center rounded-full text-[9px] font-black">
                        ?
                        <div class="tooltiptext">
                            <strong class="text-indigo-300 block mb-2 pb-1 border-b border-white/10">Güven Seviyesi?</strong>
                            Değerlendiren sayısına ne kadar ağırlık verileceğini belirler. <strong>2. Derece</strong> en dengelisidir.
                        </div>
                    </div>
                </div>
                <select id="zScore" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer font-semibold text-slate-700 bg-white transition-all text-sm">
                    <option value="1">1. Derece (Puan Odaklı)</option>
                    <option value="1.96" selected>2. Derece (Dengeli)</option>
                    <option value="3">3. Derece (Veri Odaklı)</option>
                </select>
            </div>
        </div>

        <div class="bg-indigo-50 p-6 rounded-3xl shadow-sm mb-8 border border-indigo-100/50">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <div class="md:col-span-4">
                     <input type="text" id="pName" placeholder="Ürün Adı" class="w-full p-3 border border-indigo-100 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white text-sm">
                </div>
                <div class="md:col-span-3">
                    <input type="number" id="pRating" step="0.1" placeholder="Puanı" class="w-full p-3 border border-indigo-100 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white text-sm">
                </div>
                <div class="md:col-span-3">
                     <input type="number" id="pCount" placeholder="Değerlendiren Sayısı" class="w-full p-3 border border-indigo-100 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <button onclick="addProduct()" class="w-full h-full bg-indigo-600 text-white font-black p-3 rounded-xl hover:bg-indigo-700 transition-all active:scale-95 shadow-md shadow-indigo-200 text-sm">
                        EKLE
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="scroll-hint text-[10px] text-center p-2 text-indigo-400 bg-indigo-50 font-bold uppercase tracking-tighter">
                ↔ Tabloyu sağa kaydırabilirsiniz
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px] md:min-w-full">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-black tracking-widest border-b border-slate-200">
                            <th class="p-4 text-center w-12">#</th>
                            <th class="p-4">Ürün</th>
                            <th class="p-4 text-center">Puan</th>
                            <th class="p-4 text-center">Kişi</th>
                            <th class="p-4 text-right text-indigo-700">Beta Skor</th>
                            <th class="p-4 text-center w-14"></th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="text-slate-700">
                        </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center p-12 text-slate-400 text-xs italic">
                Henüz veri girilmedi.
            </div>
        </div>
    </div>

    <script>
        let products = [];

        function calculateBetaScore(rating, count, maxScale, z) {
            let alpha = (count * rating) + 1;
            let beta = (count * maxScale - count * rating) + 1;
            let n = alpha + beta;
            let mean = alpha / n;
            let variance = (alpha * beta) / (Math.pow(n, 2) * (n + 1));
            return (mean - (z * Math.sqrt(variance))) * maxScale;
        }

        function addProduct() {
            const nameInp = document.getElementById('pName');
            const rateInp = document.getElementById('pRating');
            const countInp = document.getElementById('pCount');
            const maxScale = parseFloat(document.getElementById('maxScale').value);
            const z = parseFloat(document.getElementById('zScore').value);

            const rating = parseFloat(rateInp.value);
            const count = parseInt(countInp.value);
            const name = nameInp.value.trim() || ("Ürün #" + (products.length + 1));

            if(isNaN(rating) || isNaN(count)) return alert("Eksik bilgi!");
            if(rating > maxScale) return alert("Puan hatalı!");

            products.push({ name, rating, count });
            updateTable();
            
            nameInp.value = ""; rateInp.value = ""; countInp.value = "";
            nameInp.focus();
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            updateTable();
        }

        function updateTable() {
            const z = parseFloat(document.getElementById('zScore').value);
            const maxScale = parseFloat(document.getElementById('maxScale').value);
            const tbody = document.getElementById('productTableBody');
            const empty = document.getElementById('emptyState');

            if(products.length === 0) {
                tbody.innerHTML = "";
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            products.forEach(p => p.betaScore = calculateBetaScore(p.rating, p.count, maxScale, z));
            products.sort((a, b) => b.betaScore - a.betaScore);

            tbody.innerHTML = products.map((p, i) => `
                <tr class="product-row border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                    <td class="p-4 text-center font-bold text-slate-300 text-xs">#${i + 1}</td>
                    <td class="p-4 font-bold text-slate-800 text-sm">${p.name}</td>
                    <td class="p-4 text-center">
                        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold">${p.rating}</span>
                    </td>
                    <td class="p-4 text-center font-medium text-slate-500 text-xs">${p.count.toLocaleString()}</td>
                    <td class="p-4 text-right font-black text-indigo-700 text-base tracking-tighter">${p.betaScore.toFixed(3)}</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteProduct(${i})" class="text-slate-300 hover:text-red-500 p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('zScore').addEventListener('change', updateTable);
        document.getElementById('maxScale').addEventListener('change', updateTable);
    </script>
</body>
</html>
